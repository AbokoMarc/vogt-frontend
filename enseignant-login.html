<!DOCTYPE html>
<html lang="fr">
<head>
<script src="js/config.js"></script>
<script src="js/theme-toggle.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Enseignant — VOGT HIGH TECH</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  body{ background: var(--color-primary); }
  .auth-wrap{ max-width:400px; margin: 96px auto; }
  .brand-center{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:28px; color:#fff; text-align:center; }
</style>
</head>
<body>

<div class="wrap auth-wrap">
  <div class="brand-center">
    <span class="brand-mark">V</span>
    <div><b style="font-family:var(--font-head);">VOGT HIGH TECH</b><br><span style="font-family:var(--font-mono); font-size:.72rem; color:var(--color-secondary);">ESPACE ENSEIGNANT</span></div>
  </div>
  <div class="panel">
    <div id="formMessage"></div>
    <form id="loginForm">
      <div class="field"><label>Email enseignant</label><input type="email" id="loginEmail" required></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="loginPassword" required></div>
      <button type="submit" class="btn btn-accent btn-block">Se connecter</button>
    </form>
    <p class="field-hint" style="margin-top:14px; text-align:center;"><a href="forgot-password.html" style="color:var(--color-accent);">Mot de passe oublié ?</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const box = document.getElementById("formMessage");
    box.innerHTML = "";
    try {
      const data = await VogtAPI.login(email, password);
      if (data.role !== "TEACHER") {
        VogtAPI.logout();
        box.innerHTML = `<div class="alert alert-error">Ce compte n'est pas un compte enseignant.</div>`;
        return;
      }
      window.location.href = "enseignant.html";
    } catch (err) {
      box.innerHTML = `<div class="alert alert-error">${err.message || "Identifiants invalides."}</div>`;
    }
  });

  if (VogtAPI.isAuthenticated() && VogtAPI.getRole() === "TEACHER") window.location.href = "enseignant.html";
</script>
</body>
</html>

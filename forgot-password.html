<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — VOGT HIGH TECH</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>.auth-wrap{ max-width:420px; margin: 80px auto; }</style>
</head>
<body>
<header>
  <div class="wrap header-row">
    <a href="index.html" class="brand"><span class="brand-mark">V</span><span class="brand-text"><b>VOGT HIGH TECH</b><span>ÉCOLE SUPÉRIEURE — INUCASTY</span></span></a>
    <nav class="primary-nav"><a href="index.html">Accueil</a></nav>
    <div class="header-actions"></div>
  </div>
</header>

<div class="wrap auth-wrap">
  <div class="panel">
    <h3 style="margin-bottom:8px;">Mot de passe oublié</h3>
    <p class="field-hint" style="margin-bottom:18px;">Entrez votre email. Si un compte existe, un lien de réinitialisation valable 1 heure vous sera envoyé.</p>
    <div id="msg"></div>
    <form id="forgotForm">
      <div class="field"><label>Email</label><input type="email" id="email" required></div>
      <button type="submit" class="btn btn-accent btn-block">Envoyer le lien</button>
    </form>
  </div>
</div>

<footer><div class="wrap"><span class="badge-inucasty">Une école de l'INUCASTY</span><span class="copyright">© 2026 VOGT HIGH TECH</span></div></footer>

<script>window.VOGT_API_BASE_URL = "https://vogt-backend.onrender.com/api/v1";</script>
<script src="js/api.js"></script>
<script>
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const box = document.getElementById("msg");
    try {
      await VogtAPI.forgotPassword(document.getElementById("email").value);
      box.innerHTML = `<div class="alert alert-success">Si un compte existe avec cet email, un lien de réinitialisation a été envoyé.</div>`;
    } catch (err) {
      box.innerHTML = `<div class="alert alert-success">Si un compte existe avec cet email, un lien de réinitialisation a été envoyé.</div>`;
    }
  });
</script>
<script src="js/mobile-nav.js"></script>
</body>
</html>

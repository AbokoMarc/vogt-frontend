<!DOCTYPE html>
<html lang="fr">
<head>
<script src="js/theme-toggle.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — VOGT HIGH TECH</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>.auth-wrap{ max-width:420px; margin: 80px auto; }</style>
</head>
<body>
<header>
  <div class="wrap header-row">
    <a href="index.html" class="brand"><span class="brand-mark">V</span><span class="brand-text"><b>VOGT HIGH TECH</b><span>ÉCOLE SUPÉRIEURE — INUCASTY</span></span></a>
    <nav class="primary-nav"><a href="index.html">Accueil</a></nav>
    <div class="header-actions"></div>
  </div>
</header>

<div class="wrap auth-wrap">
  <div class="panel">
    <h3 style="margin-bottom:18px;">Nouveau mot de passe</h3>
    <div id="msg"></div>
    <form id="resetForm">
      <div class="field"><label>Nouveau mot de passe</label><input type="password" id="newPassword" required minlength="8"></div>
      <div class="field"><label>Confirmer le mot de passe</label><input type="password" id="confirmPassword" required minlength="8"></div>
      <button type="submit" class="btn btn-accent btn-block">Réinitialiser</button>
    </form>
  </div>
</div>

<footer><div class="wrap"><span class="badge-inucasty">Une école de l'INUCASTY</span><span class="copyright">© 2026 VOGT HIGH TECH</span></div></footer>

<script>window.VOGT_API_BASE_URL = "https://vogt-backend.onrender.com/api/v1";</script>
<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email");
  const token = params.get("token");

  if (!email || !token) {
    document.getElementById("msg").innerHTML = `<div class="alert alert-error">Lien invalide. Refaites une demande depuis "Mot de passe oublié".</div>`;
    document.getElementById("resetForm").style.display = "none";
  }

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const box = document.getElementById("msg");
    const p1 = document.getElementById("newPassword").value;
    const p2 = document.getElementById("confirmPassword").value;
    if (p1 !== p2) {
      box.innerHTML = `<div class="alert alert-error">Les mots de passe ne correspondent pas.</div>`;
      return;
    }
    try {
      await VogtAPI.resetPassword(email, token, p1);
      box.innerHTML = `<div class="alert alert-success">Mot de passe réinitialisé. Vous pouvez maintenant vous connecter.</div>`;
      document.getElementById("resetForm").style.display = "none";
    } catch (err) {
      box.innerHTML = `<div class="alert alert-error">${err.message || "Lien invalide ou expiré."}</div>`;
    }
  });
</script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
